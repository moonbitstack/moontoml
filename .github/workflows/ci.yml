name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      - name: docs api is up to date
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/gen_api.py
          git diff --exit-code docs/api.html

      # Every MoonBit block in the README and the skill has to compile as written.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check_snippets.py

      # The corpus the conformance tests read is generated, so it has to match the
      # script that writes it. Only Linux needs the download, and only once.
      - name: conformance vectors are up to date
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_vectors.py
          git diff --exit-code

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: lts/*

      # The official suite, run the way its authors meant it to be run: the tool
      # drives the library as a decoder and as an encoder, document by document,
      # at each edition the suite lists.
      - name: toml-test (both editions, both directions)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/toml-test"
          curl -fsSL -o "$RUNNER_TEMP/toml-test.gz" \
            https://github.com/toml-lang/toml-test/releases/download/v2.2.0/toml-test-v2.2.0-linux-amd64.gz
          gunzip -c "$RUNNER_TEMP/toml-test.gz" > "$RUNNER_TEMP/toml-test/toml-test"
          chmod +x "$RUNNER_TEMP/toml-test/toml-test"
          moon build --target js --release src/conformance
          "$RUNNER_TEMP/toml-test/toml-test" test -toml 1.0.0 -color never \
            -decoder "node scripts/toml_test_driver.mjs decode 10" \
            -encoder "node scripts/toml_test_driver.mjs encode"
          "$RUNNER_TEMP/toml-test/toml-test" test -toml 1.1.0 -color never \
            -decoder "node scripts/toml_test_driver.mjs decode 11" \
            -encoder "node scripts/toml_test_driver.mjs encode"

      # Two independent implementations, both directions, over the same corpus:
      # CPython's tomllib reads what our writer emits, tomli-w writes what our
      # reader reads, and both read the suite's own bytes the way we do.
      - name: interop with CPython tomllib and tomli-w
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/moontoml-interop"
          "$RUNNER_TEMP/moontoml-interop/bin/python" -m pip install --quiet tomli-w==1.2.0
          "$RUNNER_TEMP/moontoml-interop/bin/python" scripts/interop_python.py
