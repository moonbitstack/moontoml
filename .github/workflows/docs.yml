name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: build the site
        run: |
          moon update
          moon build --target js --release src/examples/inspector
          mkdir -p docs/engine
          cp _build/js/release/build/examples/inspector/inspector.js docs/engine/moontoml.js
          (cd docs && npm install --no-audit --no-fund && npm run build)
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html
          mkdir -p _site
          cp docs/index.html docs/guide.html docs/api.html _site/
          cp -r docs/assets docs/engine _site/


      - name: configure pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
